    rel="stylesheet">
  <link rel="stylesheet" href="student.css">
</head>

<body>

  <main>

    <!-- ORIGINAL NAVIGATION BAR -->

    <nav class="navbar navbar-expand-lg navbar-dark" data-bs-theme="dark">

      <div class="container-fluid">

        <a class="navbar-brand" href="index.html">

        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarDarkDrawer"
          aria-controls="navbarDarkDrawer" aria-expanded="false" aria-label="Toggle navigation">

          <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarDarkDrawer">

          <ul class="navbar-nav me-auto">

            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="student.html">
                Students
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="gallery.html">
                Gallery
              </a>
            </li>

          </ul>

          <form class="d-flex gap-2" role="search" onsubmit="return false;">

            <input class="form-control" type="search" placeholder="Search" aria-label="Search">

            <button class="btn-icon" type="submit" aria-label="Search">

              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor"
                stroke-width="2" viewBox="0 0 24 24">

    </nav>


    <!-- STUDENTS HEADING -->

    <section class="students-heading">

      <div class="students-label">
        CIS · Cohort II
      </div>

      <h1>
        Our <span>Students</span>
      </h1>

      <p>
        Celebrating the students, talents, and people who make
        our CIS Cohort II community special.
      </p>

    </section>


    <!-- ORIGINAL STUDENT IMAGE SLIDESHOW -->

    <section id="picture_repo">
      <!-- maxWidth: { xs: '100%', sm: 'calc(50% - 5.33rem)', md: 'calc(33.333% - 5.33rem)' } -->
      <section class="card picture_repo__student">
        <img src="images/student-images/ndukwe-emmanuel.jpg" class="card-img-top" alt="...">
        <div class="card-body">
          <h4 class="card-title">Ndukwe Emmanuel</h4>
          <p class="card-text"></p>
        </div>
      </section>
    </section>

  </main>


  <!-- BOOTSTRAP JAVASCRIPT -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- SLIDESHOW PLAY AND PAUSE -->

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const carouselElement = document.getElementById(
        "carouselExampleAutoplaying"
      );

      const pausePlayButton = document.getElementById("pausePlayButton");
      const pausePlayIcon = document.getElementById("pausePlayIcon");

      const carousel = bootstrap.Carousel.getOrCreateInstance(
        carouselElement,
        {
          interval: 3000,
          ride: "carousel",
          wrap: true,
          touch: true
        }
      );

      let isPlaying = true;

      pausePlayButton.addEventListener("click", function () {

        if (isPlaying) {

          carousel.pause();

          pausePlayIcon.textContent = "▶";
          pausePlayButton.setAttribute(
            "aria-label",
            "Play slideshow"
          );

          isPlaying = false;

        } else {

          carousel.cycle();

          pausePlayIcon.textContent = "Ⅱ";
          pausePlayButton.setAttribute(
            "aria-label",
            "Pause slideshow"
          );

          isPlaying = true;

        }

      });

    });
  </script>

</body>

</html>
